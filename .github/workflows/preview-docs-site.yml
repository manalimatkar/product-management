# Builds and publishes a live preview of the docs site for an open PR, at
# https://<owner>.github.io/<repo>/pr-<number>/ -- so reviewing a change
# starts from the actual rendered page, not a raw markdown diff. Removes
# the preview when the PR closes, so previews don't accumulate forever.
#
# Shares the same gh-pages branch as deploy-docs-site.yml's main-site
# deploy, in its own pr-<number>/ subfolder -- both use
# publish_to_gh_pages.sh, the mechanism verified (against an isolated
# scratch git remote, not just reasoned about) to update one destination
# on that branch without disturbing the main site or any other PR's
# preview. See that script's own header for what was tested.
#
# Same two one-time repository settings this depends on as
# deploy-docs-site.yml: repo visibility Public, and
# Settings -> Pages -> Source: "Deploy from a branch" (gh-pages, root).
#
# Scoped to PRs targeting main only (matching deploy-docs-site.yml's own
# push trigger), and further scoped by paths to only the files that can
# actually change the built site -- fixed 2026-09-24 after PRs against the
# agents integration branch (agent-framework changes, never sample-project
# content) were triggering this preview and posting an irrelevant
# preview-link comment on every one of them. Branch-only was not enough on
# its own: an unrelated main-targeted change (e.g. a typo fix in a root
# doc) would still have triggered a pointless build without the paths
# filter too.
#
# The paths filter itself (generalized 2026-09-24) excludes framework-owned
# folders rather than naming specific product folders -- same
# match-everything-then-exclude-then-reinclude pattern and same
# FRAMEWORK_DIRS-in-build_docs_site.py source of truth as
# deploy-docs-site.yml; see that workflow's own header for the full
# explanation. A hardcoded "pdf-workflow/**" would silently stop matching
# the moment this framework analyzes a second product.
#
# "Stage sample-project content" passes the real PR head SHA/number/repo
# through to build_docs_site.py -- required for the in-preview commenting
# widget (comment-map.json) to know which PR/commit to post a GitHub
# review comment against. Missing this was a real bug caught while first
# testing the widget live: the preview built and deployed fine, but
# comment-map.json came out with all three fields null, so the widget
# correctly (but unhelpfully) hid itself entirely.

name: Preview docs site for a PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!templates/**"
      - "!.claude/**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!PRD.md"
      - "!IMPLEMENTATION-PLAN.md"
      - "!.github/**"
      - ".github/scripts/build_docs_site.py"
      - ".github/scripts/generate_index_page.py"
      - ".github/scripts/generate_relationship_graph.py"
      - ".github/scripts/verify_registries.py"
      - ".github/workflows/preview-docs-site.yml"
      - "mkdocs.yml"

permissions:
  contents: write # pushes to the gh-pages branch
  pull-requests: write # comments the preview link on the PR

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      - name: Stage sample-project content
        run: |
          python .github/scripts/build_docs_site.py \
            --commit-sha "${{ github.event.pull_request.head.sha }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"

      - name: Build site (fails on any broken internal link)
        run: mkdocs build --strict

      - name: Publish preview to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish_to_gh_pages.sh site "pr-${{ github.event.pull_request.number }}" \
            "Preview for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/post_preview_comment.sh "${{ github.event.pull_request.number }}" \
            "**Docs preview:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/

          Updates automatically on every push to this PR. Removed when the PR closes."

  remove-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview from gh-pages branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/remove_gh_pages_preview.sh "pr-${{ github.event.pull_request.number }}" \
            "Remove preview for closed PR #${{ github.event.pull_request.number }}"

      - name: Note the preview was removed on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/post_preview_comment.sh "${{ github.event.pull_request.number }}" \
            "Docs preview removed -- this PR is closed."
