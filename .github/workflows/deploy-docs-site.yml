# Builds and deploys the product docs site (real product content this framework
# has been used to analyze -- Journeys, Capabilities, Business Rules, Design
# Analyses -- for whichever platform-slug folder(s) exist) to GitHub Pages.
#
# Publishes to the gh-pages branch root rather than using the modern
# actions/deploy-pages flow, because that flow replaces the entire published
# site on every run -- incompatible with preview-docs-site.yml's per-PR
# preview subfolders (pr-<number>/) needing to coexist alongside this site.
# publish_to_gh_pages.sh is the shared, tested mechanism both workflows use;
# see that script's own header for what was verified before it was trusted.
#
# Requires two one-time repository settings changes, neither done by this workflow:
#   1. Repository visibility: Public (GitHub Pages is not available on a private repo
#      below GitHub Pro/Team/Enterprise).
#   2. Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch",
#      branch "gh-pages", folder "/ (root)".
#
# Scope is deliberately open-ended on the content side and narrow only on the
# framework side: build_docs_site.py stages every top-level directory EXCEPT a
# small, stable denylist of framework-owned folders (specs/, templates/,
# .claude/, .github/, .venv/, .git/, the gitignored site/site-src build output)
# -- see that script's own FRAMEWORK_DIRS constant, the single source of truth
# both it and this trigger's paths filter are kept in sync with by hand.
# Deliberately NOT a list naming specific product folders (e.g. "pdf-workflow"):
# that would silently exclude the next real product this framework analyzes.
# See memory: docs-site-excludes-framework-tooling.
#
# The push trigger's paths filter (added 2026-09-24, generalized the same day)
# mirrors that scope with a "match everything, then exclude framework paths,
# then re-include the specific scripts/config that generate the site" pattern
# -- GitHub evaluates the LAST matching pattern in this list for each changed
# file, so order matters: the framework exclusions must come before the
# specific re-inclusions below them for a build script to correctly override
# the broader ".github/**" exclusion. A framework/agent-only change (e.g. a
# spec or a .claude/ file) produces byte-identical site output, so it must
# never trigger a deploy; a new product folder needs zero changes here to
# start triggering one.

name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!specs/**"
      - "!templates/**"
      - "!.claude/**"
      - "!README.md"
      - "!CLAUDE.md"
      - "!PRD.md"
      - "!IMPLEMENTATION-PLAN.md"
      - "!.github/**"
      - ".github/scripts/build_docs_site.py"
      - ".github/scripts/generate_index_page.py"
      - ".github/scripts/generate_relationship_graph.py"
      - ".github/scripts/verify_registries.py"
      - ".github/workflows/deploy-docs-site.yml"
      - "mkdocs.yml"
  workflow_dispatch: {}

permissions:
  contents: write # pushes to the gh-pages branch

concurrency:
  group: gh-pages-root
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs
        run: pip install mkdocs==1.6.1 mkdocs-material==9.7.7

      - name: Stage sample-project content
        run: python .github/scripts/build_docs_site.py

      - name: Build site (fails on any broken internal link)
        run: mkdocs build --strict

      - name: Publish to gh-pages branch root
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish_to_gh_pages.sh site . "Deploy main site (${{ github.sha }})"
