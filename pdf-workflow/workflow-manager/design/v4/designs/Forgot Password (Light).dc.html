<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Inter", Arial, sans-serif; }
    a { text-decoration: none; }
    .wf-ic svg { display: block; }
    .mrl-input { border-radius: 6px; padding: 10px 12px; font-size: 13.5px; width: 100%; font-family: inherit; }
    .mrl-btn { border-radius: 6px; padding: 11px 12px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; }
    .mrl-icon-btn { border: none; background: none; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
  </style>
</helmet>

<div style="min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px; background: {{ t.bg }}; position:relative;">
  <button type="button" class="mrl-icon-btn" aria-label="Toggle theme" title="Toggle theme" style="position:fixed; top:20px; right:20px; color: {{ t.textMuted }};" onClick="{{ toggleTheme }}">
    <svg class="wf-ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="{{ themeIconPath }}"></path></svg>
  </button>

  <div style="width:100%; max-width:380px;">
    <div style="display:flex; align-items:center; gap:8px; justify-content:center; margin-bottom:28px;">
      <span style="width:28px; height:28px; border-radius:7px; background: {{ t.accent }}; color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;">F</span>
      <span style="font-size:17px; font-weight:700; color: {{ t.text }};">Formwork</span>
    </div>

    <div style="background: {{ t.surface }}; border:1px solid {{ t.border }}; border-radius:12px; padding:32px; box-shadow: 0 8px 24px rgba(0,0,0,0.08);">
      <a href="Login (Light).dc.html" style="display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color: {{ t.textMuted }}; margin-bottom:16px;">
        <svg class="wf-ic" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
        Back to log in
      </a>

      <sc-if value="{{ isPending }}">
        <h1 style="font-size:20px; font-weight:700; color: {{ t.text }}; margin:0 0 4px;">Reset your password</h1>
        <p style="font-size:13px; color: {{ t.textMuted }}; margin:0 0 24px;">Enter your email and we'll send a reset link.</p>
        <form onSubmit="{{ onSubmit }}" style="display:flex; flex-direction:column; gap:16px;">
          <div>
            <label for="fp-email" style="display:block; font-size:12.5px; color: {{ t.text }}; margin-bottom:6px;">Email</label>
            <input class="mrl-input" id="fp-email" type="email" required placeholder="you@company.com" value="{{ email }}" onInput="{{ onEmailChange }}" style="background: {{ t.inputBg }}; border:1px solid {{ t.inputBorder }}; color: {{ t.text }};">
          </div>
          <sc-if value="{{ error }}"><div style="font-size:12.5px; color: {{ t.low }};">{{ error }}</div></sc-if>
          <button type="submit" class="mrl-btn" disabled="{{ !canSubmit }}" style="background: {{ t.accent }}; color:#fff; opacity: {{ submitOpacity }};">Send reset link</button>
        </form>
      </sc-if>

      <sc-if value="{{ isSent }}">
        <div style="width:44px; height:44px; border-radius:50%; background: {{ t.accentBg }}; display:flex; align-items:center; justify-content:center; margin-bottom:16px;">
          <svg class="wf-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{ t.accent }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
        </div>
        <h1 style="font-size:20px; font-weight:700; color: {{ t.text }}; margin:0 0 8px;">Check your email</h1>
        <p style="font-size:13px; color: {{ t.textMuted }}; margin:0;">We've sent a reset link to <strong style="color: {{ t.text }};">{{ email }}</strong>. It expires in 30 minutes.</p>
        <button type="button" class="mrl-btn" onClick="{{ onResend }}" style="background: {{ t.tagBg }}; color: {{ t.text }}; margin-top:20px;">Resend link</button>
      </sc-if>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
const THEMES = {
  light: { bg: '#f9fafb', border: '#e5e7eb', text: '#111827', textMuted: '#6b7280', surface: '#ffffff', inputBg: '#ffffff', inputBorder: '#d1d5db', tagBg: '#f3f4f6', accent: '#4f46e5', accentBg: '#eef2ff', low: '#dc2626' },
  dark: { bg: '#14151f', border: '#2a2c3a', text: '#e9e9ed', textMuted: '#9a9aa8', surface: '#1c1e2a', inputBg: '#20222f', inputBorder: '#34364a', tagBg: '#262838', accent: '#9184d9', accentBg: '#2a2740', low: '#f87171' },
};

class Component extends DCLogic {
  state = { theme: 'light', email: '', error: '', sent: false };
  onEmailChange = (e) => this.setState({ email: e.target.value, error: '' });
  toggleTheme = () => this.setState((s) => ({ theme: s.theme === 'light' ? 'dark' : 'light' }));
  onSubmit = (e) => {
    e.preventDefault();
    if (!this.state.email.includes('@')) { this.setState({ error: 'Enter a valid email.' }); return; }
    this.setState({ sent: true });
  };
  onResend = () => {};
  renderVals() {
    const s = this.state;
    const t = THEMES[s.theme];
    const isDark = s.theme === 'dark';
    const canSubmit = s.email.includes('@');
    return {
      t, theme: s.theme, toggleTheme: this.toggleTheme,
      themeIconPath: isDark ? 'M12 3v1M12 20v1M4.2 4.2l.7.7M18.4 18.4l.7.7M3 12h1M20 12h1M4.2 19.8l.7-.7M18.4 5.6l.7-.7M12 7a5 5 0 100 10 5 5 0 000-10z' : 'M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5z',
      email: s.email, error: s.error, onEmailChange: this.onEmailChange, onSubmit: this.onSubmit, onResend: this.onResend,
      canSubmit, submitOpacity: canSubmit ? 1 : 0.55,
      isPending: !s.sent, isSent: s.sent,
    };
  }
}
</script>
</body>
</html>
